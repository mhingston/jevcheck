name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @mhingston5/jev-cli 0.3.0 is landed but not yet published to npm.
      # Build the exact landed commit so this PR can verify against the intended API.
      # Remove this source override once 0.3.0 is published.
      - uses: actions/checkout@v4
        with:
          repository: mhingston/jev-cli
          ref: a893230ab0cf0fdc068e33647a68e2bd5e579408
          path: .deps/jev-cli

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build pinned jev-cli
        working-directory: .deps/jev-cli
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Install dependencies
        run: |
          cp package.json package.json.release
          npm pkg set 'dependencies.@mhingston5/jev-cli=file:.deps/jev-cli'
          npm install --ignore-scripts
          mv package.json.release package.json

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
